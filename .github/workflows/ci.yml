name: AxonGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q axongate axongate_gateway.py examples scripts

      - name: Run ASGI smoke tests
        run: python scripts/ci_smoke.py

      - name: Secret scan tracked files
        run: python scripts/secret_scan.py
